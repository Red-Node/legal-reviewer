<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legal Reviewer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; font-family: system-ui, sans-serif; color: #203047; background: #f3f5f8; }
    main { max-width: 900px; margin: auto; }
    h1 { margin-bottom: 8px; }
    .intro { color: #526078; margin-bottom: 24px; }
    form, .page, .detections { background: white; border: 1px solid #d6dde7; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 12px; }
    input { display: block; max-width: 100%; font: inherit; }
    .hint { color: #526078; font-size: 14px; }
    button { border: 0; border-radius: 6px; padding: 12px 20px; background: #2457b5; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 3px solid #7da9f8; outline-offset: 4px; }
    #error { padding: 16px; border-radius: 6px; background: #fce8e8; color: #922020; }
    #summary { overflow-wrap: anywhere; }
    .page h2 { margin-top: 0; font-size: 20px; }
    .detections h2 { margin-top: 0; font-size: 20px; }
    .detections li { margin-bottom: 12px; overflow-wrap: anywhere; }
    .detections ul { padding-left: 24px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.6 system-ui, sans-serif; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Legal Reviewer</h1>
    <p class="intro">Upload a PDF to read its extracted text, page by page.</p>

    <form id="upload-form">
      <label for="pdf-file">Choose a PDF document</label>
      <input id="pdf-file" type="file" accept=".pdf,application/pdf" aria-describedby="upload-hint">
      <p class="hint" id="upload-hint">Maximum size: 10 MB. Use a PDF with selectable text. Uploaded documents are not permanently stored.</p>
      <button id="analyze-button" type="submit">Analyze Document</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>
    <section id="results" aria-label="Extracted document text" hidden>
      <h2 id="summary"></h2>
      <div id="pages"></div>
      <section class="detections" aria-labelledby="sections-heading">
        <h2 id="sections-heading">Detected Sections</h2>
        <ul id="detected-sections"></ul>
        <p id="no-sections" hidden>No section headings detected.</p>
      </section>
      <section class="detections" aria-labelledby="references-heading">
        <h2 id="references-heading">Section References</h2>
        <ul id="section-references"></ul>
        <p id="no-references" hidden>No explicit section references detected.</p>
      </section>
    </section>
  </main>

  <script>
    const form = document.getElementById("upload-form");
    const fileInput = document.getElementById("pdf-file");
    const button = document.getElementById("analyze-button");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const results = document.getElementById("results");
    const summary = document.getElementById("summary");
    const pages = document.getElementById("pages");
    const detectedSections = document.getElementById("detected-sections");
    const sectionReferences = document.getElementById("section-references");
    const noSections = document.getElementById("no-sections");
    const noReferences = document.getElementById("no-references");
    const maxFileSize = 10 * 1024 * 1024;

    function showError(message) {
      error.textContent = message;
      error.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      results.hidden = true;
      pages.replaceChildren();
      detectedSections.replaceChildren();
      sectionReferences.replaceChildren();
      summary.textContent = "";
      status.textContent = "";

      const file = fileInput.files[0];
      if (!file) {
        showError("Please choose a PDF file.");
        return;
      }
      if (!file.name.toLowerCase().endsWith(".pdf")) {
        showError("Please upload a PDF file (.pdf).");
        return;
      }
      if (file.size > maxFileSize) {
        showError("The file is too large. The maximum size is 10 MB.");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      button.disabled = true;
      fileInput.disabled = true;
      status.textContent = "Reading your PDF…";

      try {
        const response = await fetch("/analyze", { method: "POST", body: formData });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(typeof data.detail === "string" ? data.detail : "The document could not be read. Please try another PDF.");
        }

        summary.textContent = `${data.filename} — ${data.total_pages} ${data.total_pages === 1 ? "page" : "pages"}`;
        for (const page of data.pages) {
          const section = document.createElement("section");
          section.className = "page";
          const heading = document.createElement("h2");
          heading.textContent = `Page ${page.number}`;
          const text = document.createElement("pre");
          // Use textContent so document text is always displayed as plain text.
          text.textContent = page.text.trim() ? page.text : "No extractable text on this page.";
          section.append(heading, text);
          pages.append(section);
        }
        for (const section of data.sections) {
          const item = document.createElement("li");
          item.textContent = `Section ${section.number} — ${section.title} (Page ${section.page})`;
          detectedSections.append(item);
        }
        for (const reference of data.references) {
          const item = document.createElement("li");
          item.textContent = `Section ${reference.number} (Page ${reference.page}) — “${reference.text}”`;
          sectionReferences.append(item);
        }
        noSections.hidden = data.sections.length > 0;
        noReferences.hidden = data.references.length > 0;
        results.hidden = false;
        status.textContent = "Text extraction and section detection complete.";
      } catch (failure) {
        showError(failure instanceof TypeError ? "Could not connect to the server. Check that the application is running and try again." : failure.message);
        status.textContent = "";
      } finally {
        button.disabled = false;
        fileInput.disabled = false;
      }
    });
  </script>
</body>
</html>
